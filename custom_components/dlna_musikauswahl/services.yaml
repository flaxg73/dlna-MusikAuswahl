load_media:
  target:
    entity:
      integration: dlna_musikauswahl
      domain: media_player
  fields:
    media_content_id:
      required: true
      example: "dlnamusik://uuid%3A1234/album%2042"
      selector:
        text:
    mode:
      default: replace
      selector:
        select:
          translation_key: mode
          options:
            - replace
            - add
            - next
            - play
    play:
      selector:
        boolean:

play_track:
  target:
    entity:
      integration: dlna_musikauswahl
      domain: media_player
  fields:
    track_id:
      required: true
      selector:
        number:
          min: 1
          max: 4294967295
          mode: box

remove_tracks:
  target:
    entity:
      integration: dlna_musikauswahl
      domain: media_player
  fields:
    track_ids:
      required: true
      example: "[12, 13]"
      selector:
        object:

move_track:
  target:
    entity:
      integration: dlna_musikauswahl
      domain: media_player
  fields:
    track_id:
      required: true
      selector:
        number:
          min: 1
          max: 4294967295
          mode: box
    position:
      required: true
      selector:
        number:
          min: 1
          max: 1000
          mode: box
